[package]
name = "poe-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Path of Exile 1 overlay for Wayland: leveling Route, Price Check, Trade Requests"
authors = ["Nephritus <90871716+Nephritus@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nephritus/poe-overlay-linux"
readme = "README.md"
keywords = ["path-of-exile", "overlay", "wayland", "gtk4"]
categories = ["games"]
# The published crate, which `cargo install` builds: no tests, notes or prototypes.
include = ["/src", "/data", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
aes = "0.9"
async-channel = "2"
cairo = { version = "0.22", package = "cairo-rs" }
cbc = "0.2"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
libc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rusqlite = "0.43"
rustix = { version = "1", features = ["process", "fs", "event", "pipe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11"
toml = { version = "0.9", default-features = false, features = ["display", "parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
ureq = "3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", default-features = false, features = ["xkb"] }
xkbcommon = { version = "0.9", default-features = false }

[dev-dependencies]
tempfile = "3"
