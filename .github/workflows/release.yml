# On a version tag (v0.1.0), builds and checks every artifact with the same
# command as locally, packaging/release.sh, and attaches them to the release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and check the artifacts
        run: packaging/release.sh
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          # dist/aur/.SRCINFO
          include-hidden-files: true
      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME isn't v$version from Cargo.toml"; exit 1; }
          # The files, and the filled-in PKGBUILD for building it on Arch.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/SHA256SUMS dist/aur/PKGBUILD
